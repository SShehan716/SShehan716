<svg width="560" height="290" viewBox="0 0 560 290" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .mono { font-family: 'Fira Code', 'Cascadia Code', Consolas, monospace; font-size: 15px; }
      .prompt { fill: #7FDBFF; }
      .cmd { fill: #e2e8f0; }
      .comment { fill: #64748b; }
      .ok { fill: #06D6A0; }
      @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
      .cursor { animation: blink 1s step-end infinite; }
    </style>
  </defs>

  <rect width="560" height="290" rx="12" fill="#0D1117" stroke="#1e293b" stroke-width="1" />
  <rect x="0" y="0" width="560" height="34" rx="12" fill="#161b22" />
  <circle cx="22" cy="17" r="6" fill="#FF6B6B" />
  <circle cx="42" cy="17" r="6" fill="#FFD166" />
  <circle cx="62" cy="17" r="6" fill="#06D6A0" />
  <text x="280" y="22" text-anchor="middle" class="mono comment" font-size="12">sachin@dev: ~/projects</text>

  <g class="mono">
    <text x="20" y="66"><tspan class="prompt">$</tspan> <tspan class="cmd">whoami</tspan></text>
    <text x="20" y="90" class="ok">full-stack &amp; mobile developer, sri lanka</text>

    <text x="20" y="126"><tspan class="prompt">$</tspan> <tspan class="cmd">cat currently_building.txt</tspan></text>
    <text x="20" y="150" class="comment">→ POS systems, booking platforms, small business ERPs</text>

    <text x="20" y="186"><tspan class="prompt">$</tspan> <tspan class="cmd">git log --oneline -1</tspan></text>
    <text x="20" y="210" class="comment">→ "can you build this by next week?"</text>

    <text x="20" y="246"><tspan class="prompt">$</tspan> <tspan class="cmd">echo $STATUS</tspan></text>
    <text x="20" y="270"><tspan class="ok">shipping</tspan><tspan class="cmd cursor">_</tspan></text>
  </g>
</svg>

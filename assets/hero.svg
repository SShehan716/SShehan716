<svg width="1000" height="320" viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b1f5c">
        <animate attributeName="stop-color" values="#2b1f5c;#1f3a5c;#3a1f5c;#2b1f5c" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#1a2f6b">
        <animate attributeName="stop-color" values="#1a2f6b;#4b2f6b;#1a4f6b;#1a2f6b" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <style>
      .float1 { animation: float1 6s ease-in-out infinite; }
      .float2 { animation: float2 7s ease-in-out infinite; }
      .float3 { animation: float3 5s ease-in-out infinite; }
      @keyframes float1 { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-14px); } }
      @keyframes float2 { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(12px); } }
      @keyframes float3 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(6px,-10px); } }
      .txt { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1000" height="320" fill="url(#bg)" />

  <!-- floating decorative shapes -->
  <circle class="float1" cx="860" cy="70" r="10" fill="#FFD166" opacity="0.9" />
  <circle class="float2" cx="905" cy="130" r="6" fill="#FFD166" opacity="0.7" />
  <circle class="float3" cx="820" cy="180" r="16" fill="none" stroke="#7FDBFF" stroke-width="3" opacity="0.6" />
  <circle class="float1" cx="945" cy="230" r="8" fill="#FF6B6B" opacity="0.8" />
  <circle class="float2" cx="770" cy="60" r="5" fill="#7FDBFF" opacity="0.7" />
  <circle class="float3" cx="600" cy="40" r="4" fill="#A9FEF7" opacity="0.6" />

  <!-- greeting text -->
  <text x="60" y="120" class="txt" font-size="46" font-weight="700" fill="#ffffff">Hi, I'm Sachin <tspan font-size="40">👋</tspan></text>
  <text x="60" y="165" class="txt" font-size="24" font-weight="600" fill="#A9FEF7">Full-Stack &amp; Mobile Developer</text>
  <text x="60" y="198" class="txt" font-size="16" fill="#c7d2fe" opacity="0.85">Building web, mobile &amp; automation tools — based in Sri Lanka</text>

  <!-- laptop illustration -->
  <g transform="translate(600,150)">
  <g class="float1">
    <rect x="0" y="0" width="220" height="140" rx="14" fill="url(#screen)" stroke="#334155" stroke-width="2" />
    <rect x="14" y="14" width="192" height="112" rx="4" fill="#0b1220" />
    <text x="110" y="90" text-anchor="middle" class="txt" font-size="42" font-weight="700" fill="#7FDBFF">&lt;/&gt;</text>
    <circle cx="30" cy="30" r="4" fill="#FF6B6B" />
    <circle cx="44" cy="30" r="4" fill="#FFD166" />
    <circle cx="58" cy="30" r="4" fill="#06D6A0" />
    <rect x="-16" y="140" width="252" height="14" rx="7" fill="#1e293b" />
  </g>
  </g>

  <!-- phone illustration -->
  <g transform="translate(700,60)">
  <g class="float2">
    <rect x="0" y="0" width="60" height="104" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <rect x="7" y="10" width="46" height="76" rx="3" fill="#0b1220" />
    <rect x="20" y="30" width="20" height="4" rx="2" fill="#06D6A0" />
    <rect x="20" y="40" width="20" height="4" rx="2" fill="#7FDBFF" />
    <rect x="20" y="50" width="12" height="4" rx="2" fill="#FFD166" />
  </g>
  </g>
</svg>
